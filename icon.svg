    </g>

    <g filter="url(#bubble-shadow)">
      <circle cx="512" cy="476" r="194" fill="url(#planet)"/>
      <path d="M349 583 C334 661 311 712 294 739 Q289 748 300 744 C356 717 413 687 463 663 Z" fill="url(#planet)"/>
    </g>

    <circle cx="512" cy="476" r="191" fill="url(#sheen)"/>

    <g fill="url(#dots)">
