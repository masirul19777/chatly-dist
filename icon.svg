    <circle cx="833" cy="372" r="35" fill="#ffffff" opacity="0.42" filter="url(#moon-glow)"/>
    <circle cx="833" cy="372" r="31" fill="#ffffff"/>
    <circle cx="825" cy="363" r="9" fill="#bfdbfe" opacity="0.92"/>

    <g fill="#ffffff">
