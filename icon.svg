<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Chatly">
  <defs>
    <linearGradient id="bg" x1="74" y1="30" x2="950" y2="1010" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b8ee8"/>
      <stop offset="0.35" stop-color="#2563eb"/>
      <stop offset="0.68" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowA" cx="225" cy="135" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7debff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="875" cy="880" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#c026d3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="350" y1="300" x2="664" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <radialGradient id="sheen" cx="433" cy="355" r="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="160" y1="0" x2="864" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.18"/>
      <stop offset="0.33" stop-color="#ffffff" stop-opacity="0.64"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="dots" x1="0" y1="450" x2="0" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="bubble-shadow" x="220" y="200" width="600" height="650" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="25" stdDeviation="27" flood-color="#030a23" flood-opacity="0.46"/>
