      <circle cx="876" cy="223" r="5" opacity="0.6"/>
      <circle cx="201" cy="746" r="4" opacity="0.45"/>
      <circle cx="852" cy="770" r="7" opacity="0.5"/>
      <circle cx="760" cy="126" r="4" opacity="0.5"/>
      <circle cx="139" cy="519" r="3" opacity="0.4"/>
